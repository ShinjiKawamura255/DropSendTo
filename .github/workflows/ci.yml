name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore
      - name: Release version tests
        shell: pwsh
        run: ./scripts/Test-Release-Version.ps1
      - name: Format
        run: dotnet format --verify-no-changes --no-restore
      - name: Release artifact tests
        shell: pwsh
        run: ./scripts/Test-Release-Artifacts.ps1
      - name: Test
        run: dotnet test -c Release --no-restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Settings GUI probe
        shell: pwsh
        run: ./scripts/Test-SettingsWindow.ps1 -Configuration Release
