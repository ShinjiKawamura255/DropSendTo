name: 機能要望 / Feature request
description: 追加したい機能や改善点
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要 / Summary
      description: どんな機能が欲しいかを簡潔に書いてください。
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: 背景 / Motivation
      description: どんな課題を解決したいか
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 解決案 / Proposed solution
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案 / Alternatives
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 補足 / Additional context
    validations:
      required: false
